<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowshoto · Dear, Shoto</title>
  <meta name="theme-color" content="#fff0f5">
  <style>
    :root{--pink:#f5a9c7;--deep:#c96b94;--pale:#fff0f5;--ink:#59434d;--muted:#a58b96;--line:#f4dce6;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#fff2f7 0,#fff9fb 340px,#fff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}
    .hero{position:relative;overflow:hidden;text-align:center;padding:42px 20px 34px;border:1px solid #f7dce7;border-radius:28px;background:radial-gradient(circle at 15% 20%,#fff 0 7%,transparent 7.5%),linear-gradient(135deg,#ffe5ef,#fff8fb 55%,#fce4ee);box-shadow:0 10px 35px #d88eaa18}
    .hero:before,.hero:after{content:"♡";position:absolute;color:#e9a3bf;font-size:30px;opacity:.7}
    .hero:before{left:24px;top:18px}.hero:after{right:25px;bottom:15px}
    .eyebrow{font-size:11px;letter-spacing:.28em;color:#c77d9c}
    h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(36px,8vw,54px);letter-spacing:.02em;margin:10px 0 5px;color:#bd6f91}
    .sub{font-size:13px;color:#a77c8e;letter-spacing:.08em}
    .intro{margin:18px auto 0;max-width:470px;font-size:13px;line-height:1.8;color:#987c88}
    .dday{display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding:9px 17px;border:1px solid #f0c7d8;border-radius:999px;background:#ffffffb8;font-size:13px;color:#b96d8f}
    .dday strong{font-size:17px;color:#c15f89}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 2px 14px}
    .section-title{font-family:Georgia,serif;font-size:21px;color:#bd6f91}
    .small{font-size:11px;color:var(--muted)}
    .btn{border:1px solid #edc5d6;background:#fff;color:#bd6f91;border-radius:999px;padding:9px 14px;font-size:12px}
    .btn.primary{background:#d987a9;color:white;border-color:#d987a9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .panel,.post{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 20px #d88eaa0d}
    .panel{margin-bottom:18px}
    .panel h2{font-size:15px;margin:0 0 13px;color:#bd6f91}
    .field{display:block;width:100%;border:1px solid #f1dce5;background:#fffafd;border-radius:12px;padding:12px 13px;color:var(--ink);outline:none;margin:8px 0}
    .field:focus{border-color:#e6a4be}
    textarea.field{min-height:105px;resize:vertical;line-height:1.6}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .preview{display:none;max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin-top:10px}
    .posts{display:grid;gap:13px}
    .post-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
    .post-title{font-size:15px;font-weight:650;white-space:pre-wrap}
    .date{font-size:11px;color:#b49aa5;white-space:nowrap}
    .post-content{font-size:13px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
    .post img{display:block;max-width:100%;max-height:560px;object-fit:contain;margin:13px auto 0;border-radius:13px}
    .post-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.edit-form{margin-top:14px;padding:14px;border:1px dashed #edc5d6;border-radius:14px;background:#fffafd}.edit-form .field{margin:8px 0}.edit-help{font-size:11px;color:#a58b96;line-height:1.6}
    .empty{text-align:center;padding:35px 15px;color:#b49aa5;font-size:13px;border:1px dashed #efcfdd;border-radius:18px}
    .login-note{font-size:12px;color:#a58b96;line-height:1.7}
    .status{font-size:12px;color:#b96d8f;margin-top:8px;min-height:18px}
    .hidden{display:none!important}
    footer{text-align:center;margin-top:35px;font:12px Georgia,serif;color:#c99aad;letter-spacing:.12em}
    @media(max-width:480px){.wrap{width:min(100% - 20px,760px);padding-top:14px}.hero{padding:35px 15px 28px}.panel,.post{padding:15px}.toolbar{margin-top:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="eyebrow">엔진 자랑타래에 오신 걸 환영합니다!</div>
      <h1>轟 焦凍</h1>
      <div class="sub">♡ 쇼토천사님과 ♡</div>
      <p class="intro">쇼토천사님 자랑타래 사이트<br>俺の力だ。</p>
      <div class="dday">TOGETHER SINCE <strong id="dday">D+0</strong></div>
    </header>

    <div class="toolbar">
      <div><div class="section-title">Our memories</div><div class="small">기록용 사이트.</div></div>
      <button class="btn" id="loginToggle">관리자 로그인</button>
    </div>

    <section class="panel hidden" id="loginPanel">
      <h2>관리자 로그인</h2>
      <p class="login-note">사이트 관리자 계정으로 로그인하면 게시물을 작성하고 관리할 수 있어요.</p>
      <input class="field" id="email" type="email" placeholder="관리자 이메일" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
      <div class="actions"><button class="btn primary" id="loginBtn">로그인</button><button class="btn" id="cancelLogin">닫기</button></div>
      <div class="status" id="loginStatus" role="status"></div>
    </section>

    <section class="panel hidden" id="composer">
      <h2>새로운 추억 남기기 ♡</h2>
      <input class="field" id="postTitle" maxlength="120" placeholder="제목 (선택)">
      <textarea class="field" id="postContent" placeholder="쇼토와의 소중한 순간을 기록해 봐."></textarea>
      <label class="small" for="postImage">사진 첨부</label>
      <input class="field" id="postImage" type="file" accept="image/*">
      <img class="preview" id="imagePreview" alt="업로드할 사진 미리보기">
      <div class="actions"><button class="btn primary" id="publishBtn">게시하기</button><button class="btn" id="logoutBtn">로그아웃</button></div>
      <div class="status" id="composerStatus" role="status"></div>
    </section>

    <section class="posts" id="posts" aria-live="polite">
      <div class="empty">추억을 불러오는 중이야… ♡</div>
    </section>
    <footer>MADE WITH 엔진</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 공개용 Project URL과 Publishable key입니다. secret/service_role 키는 절대 넣지 마세요.
    const SUPABASE_URL = "https://nkpnyhrvfwlhbktjriof.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_T7zEIdcEt3BiFQNzcPoNzw_6ha1-xL5";
    const ADMIN_UID = "42d9f7db-8114-4eb0-9621-4b17bdbdf42d";
    const BUCKET = "meowshoto-images";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = id => document.getElementById(id);
    let currentUser = null;
    let selectedFile = null;

    // 2026년 10월 4일을 기념일로 계산합니다.
    const startDate = new Date(2026, 9, 4);
    const today = new Date();
    const diff = Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate()) - startDate) / 86400000);
    $("dday").textContent = diff >= 0 ? `D+${diff}` : `D${diff}`;

    $("loginToggle").addEventListener("click", () => $("loginPanel").classList.toggle("hidden"));
    $("cancelLogin").addEventListener("click", () => $("loginPanel").classList.add("hidden"));

    $("postImage").addEventListener("change", event => {
      selectedFile = event.target.files?.[0] || null;
      const preview = $("imagePreview");
      if (selectedFile) {
        preview.src = URL.createObjectURL(selectedFile);
        preview.style.display = "block";
      } else {
        preview.removeAttribute("src");
        preview.style.display = "none";
      }
    });

    async function updateAuthUI() {
      const { data } = await supabaseClient.auth.getSession();
      currentUser = data.session?.user || null;
      const isAdmin = currentUser?.id === ADMIN_UID;
      $("loginToggle").textContent = isAdmin ? "관리자 로그인됨" : "관리자 로그인";
      $("loginToggle").disabled = isAdmin;
      $("composer").classList.toggle("hidden", !isAdmin);
      if (!isAdmin) $("loginPanel").classList.add("hidden");
    }

    $("loginBtn").addEventListener("click", async () => {
      $("loginStatus").textContent = "로그인 중…";
      const email = $("email").value.trim();
      const password = $("password").value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        $("loginStatus").textContent = "로그인에 실패했어. 이메일과 비밀번호를 확인해 줘.";
        return;
      }
      await updateAuthUI();
      $("loginStatus").textContent = currentUser?.id === ADMIN_UID ? "관리자 로그인 성공! ♡" : "이 계정에는 관리자 권한이 없어.";
      if (currentUser?.id === ADMIN_UID) $("loginPanel").classList.add("hidden");
    });

    $("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      await updateAuthUI();
      $("composerStatus").textContent = "로그아웃했어.";
    });

    $("publishBtn").addEventListener("click", async () => {
      if (currentUser?.id !== ADMIN_UID) {
        $("composerStatus").textContent = "관리자 로그인 후 이용해 줘.";
        return;
      }
      const title = $("postTitle").value.trim();
      const content = $("postContent").value.trim();
      if (!title && !content && !selectedFile) {
        $("composerStatus").textContent = "내용이나 사진을 하나 이상 추가해 줘.";
        return;
      }
      $("publishBtn").disabled = true;
      $("composerStatus").textContent = "게시물을 저장하고 있어…";
      let imageUrl = null;
      try {
        if (selectedFile) {
          if (!selectedFile.type.startsWith("image/")) throw new Error("이미지 파일만 업로드할 수 있어.");
          if (selectedFile.size > 10 * 1024 * 1024) throw new Error("사진은 10MB 이하로 올려줘.");
          const safeName = selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = `${Date.now()}-${crypto.randomUUID()}-${safeName}`;
          const { error: uploadError } = await supabaseClient.storage.from(BUCKET).upload(path, selectedFile, { upsert: false, contentType: selectedFile.type });
          if (uploadError) throw uploadError;
          const { data: publicData } = supabaseClient.storage.from(BUCKET).getPublicUrl(path);
          imageUrl = publicData.publicUrl;
        }
        const { error } = await supabaseClient.from("posts").insert({ title: title || null, content: content || null, image_url: imageUrl });
        if (error) throw error;
        $("postTitle").value = "";
        $("postContent").value = "";
        $("postImage").value = "";
        selectedFile = null;
        $("imagePreview").style.display = "none";
        $("composerStatus").textContent = "추억을 저장했어! ♡";
        await loadPosts();
      } catch (error) {
        $("composerStatus").textContent = `저장하지 못했어: ${error.message || "설정을 확인해 줘."}`;
      } finally {
        $("publishBtn").disabled = false;
      }
    });

    async function editPost(post, article) {
      if (currentUser?.id !== ADMIN_UID) return;

      // 같은 게시물에 편집창이 이미 열려 있으면 중복으로 만들지 않습니다.
      if (article.querySelector(".edit-form")) return;

      const form = document.createElement("form");
      form.className = "edit-form";

      const heading = document.createElement("div");
      heading.className = "post-title";
      heading.textContent = "게시물 수정 ♡";

      const titleInput = document.createElement("input");
      titleInput.className = "field";
      titleInput.maxLength = 120;
      titleInput.placeholder = "제목 (선택)";
      titleInput.value = post.title || "";

      const contentInput = document.createElement("textarea");
      contentInput.className = "field";
      contentInput.placeholder = "내용을 입력해 줘.";
      contentInput.value = post.content || "";

      const help = document.createElement("div");
      help.className = "edit-help";
      help.textContent = post.image_url
        ? "새 사진을 선택하지 않으면 기존 사진이 그대로 유지돼."
        : "원하면 사진을 새로 첨부할 수 있어.";

      const imageInput = document.createElement("input");
      imageInput.className = "field";
      imageInput.type = "file";
      imageInput.accept = "image/*";

      const preview = document.createElement("img");
      preview.className = "preview";
      preview.alt = "새 사진 미리보기";

      if (post.image_url) {
        const currentPhoto = document.createElement("div");
        currentPhoto.className = "edit-help";
        currentPhoto.textContent = "현재 등록된 사진";
        const currentImg = document.createElement("img");
        currentImg.src = post.image_url;
        currentImg.alt = "현재 게시물 사진";
        currentImg.style.cssText = "display:block;max-width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin:8px 0";
        form.append(heading, titleInput, contentInput, help, currentPhoto, currentImg, imageInput, preview);
      } else {
        form.append(heading, titleInput, contentInput, help, imageInput, preview);
      }

      imageInput.addEventListener("change", () => {
        const file = imageInput.files?.[0];
        if (!file) {
          preview.removeAttribute("src");
          preview.style.display = "none";
          return;
        }
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      });

      const actions = document.createElement("div");
      actions.className = "actions";
      const save = document.createElement("button");
      save.className = "btn primary";
      save.type = "submit";
      save.textContent = "수정 저장";
      const cancel = document.createElement("button");
      cancel.className = "btn";
      cancel.type = "button";
      cancel.textContent = "취소";
      cancel.addEventListener("click", () => form.remove());
      const status = document.createElement("div");
      status.className = "status";
      status.setAttribute("role", "status");
      actions.append(save, cancel);
      form.append(actions, status);
      article.append(form);

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (currentUser?.id !== ADMIN_UID) {
          status.textContent = "관리자 로그인 후 이용해 줘.";
          return;
        }

        const newTitle = titleInput.value.trim();
        const newContent = contentInput.value.trim();
        const newFile = imageInput.files?.[0] || null;
        if (!newTitle && !newContent && !newFile && !post.image_url) {
          status.textContent = "내용이나 사진을 하나 이상 남겨 줘.";
          return;
        }

        save.disabled = true;
        cancel.disabled = true;
        status.textContent = "수정 내용을 저장하고 있어…";

        try {
          let imageUrl = post.image_url || null;

          // 새 사진을 골랐을 때만 업로드하고, 선택하지 않으면 기존 사진을 유지합니다.
          if (newFile) {
            if (!newFile.type.startsWith("image/")) throw new Error("이미지 파일만 업로드할 수 있어.");
            if (newFile.size > 10 * 1024 * 1024) throw new Error("사진은 10MB 이하로 올려줘.");
            const safeName = newFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            const storagePath = `${Date.now()}-${crypto.randomUUID()}-${safeName}`;
            const { error: uploadError } = await supabaseClient.storage
              .from(BUCKET)
              .upload(storagePath, newFile, { upsert: false, contentType: newFile.type });
            if (uploadError) throw uploadError;
            const { data: publicData } = supabaseClient.storage.from(BUCKET).getPublicUrl(storagePath);
            imageUrl = publicData.publicUrl;
          }

          const { error: updateError } = await supabaseClient
            .from("posts")
            .update({ title: newTitle || null, content: newContent || null, image_url: imageUrl })
            .eq("id", post.id);

          if (updateError) {
            if (/row-level security|permission denied|not allowed/i.test(updateError.message || "")) {
              throw new Error("수정 권한이 없어. Supabase의 posts 테이블에 관리자용 UPDATE 정책이 있는지 확인해 줘.");
            }
            throw updateError;
          }

          await loadPosts();
        } catch (error) {
          status.textContent = `수정하지 못했어: ${error.message || "설정을 확인해 줘."}`;
          save.disabled = false;
          cancel.disabled = false;
        }
      });
    }

    async function deletePost(post) {
      if (currentUser?.id !== ADMIN_UID) return;
      if (!confirm("이 게시물을 삭제할까?")) return;
      const { error } = await supabaseClient.from("posts").delete().eq("id", post.id);
      if (error) alert("삭제하지 못했어: " + error.message);
      else await loadPosts();
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("ko-KR", { year:"numeric", month:"long", day:"numeric" }).format(new Date(value));
    }

    async function loadPosts() {
      const container = $("posts");
      const { data, error } = await supabaseClient.from("posts").select("*").order("created_at", { ascending: false });
      if (error) {
        container.innerHTML = '<div class="empty">게시물을 불러오지 못했어. Supabase 설정을 확인해 줘.</div>';
        return;
      }
      if (!data?.length) {
        container.innerHTML = '<div class="empty">아직 기록된 추억이 없어.<br>첫 번째 추억을 남겨줘! ♡</div>';
        return;
      }
      container.replaceChildren();
      data.forEach(post => {
        const article = document.createElement("article");
        article.className = "post";
        const head = document.createElement("div");
        head.className = "post-head";
        const title = document.createElement("div");
        title.className = "post-title";
        title.textContent = post.title || "우리의 기록 ♡";
        const date = document.createElement("time");
        date.className = "date";
        date.dateTime = post.created_at;
        date.textContent = formatDate(post.created_at);
        head.append(title, date);
        article.append(head);
        if (post.content) {
          const content = document.createElement("div");
          content.className = "post-content";
          content.textContent = post.content;
          article.append(content);
        }
        if (post.image_url) {
          const img = document.createElement("img");
          img.src = post.image_url;
          img.alt = post.title ? `${post.title} 사진` : "게시물 사진";
          img.loading = "lazy";
          article.append(img);
        }
        if (currentUser?.id === ADMIN_UID) {
          const actions = document.createElement("div");
          actions.className = "post-actions";
          const edit = document.createElement("button");
          edit.className = "btn";
          edit.textContent = "수정";
          edit.addEventListener("click", () => editPost(post, article));
          const del = document.createElement("button");
          del.className = "btn";
          del.textContent = "삭제";
          del.addEventListener("click", () => deletePost(post));
          actions.append(edit, del);
          article.append(actions);
        }
        container.append(article);
      });
    }

    supabaseClient.auth.onAuthStateChange(async () => {
      await updateAuthUI();
      await loadPosts();
    });

    (async function init() {
      await updateAuthUI();
      await loadPosts();
    })();
  </script>
</body>
</html>
